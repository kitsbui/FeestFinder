<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Khám phá</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ff.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#08090a}
a{color:#f7f8f8}a:hover{color:#ffffff}
</style>
</helmet>
<div class="ff phone">
<sc-if value="{{anyMenu}}" hint-placeholder-val="{{false}}"><button class="scrim" onClick="{{closeMenus}}" aria-label="Đóng menu"></button></sc-if>

<header class="bar" style="position: relative; z-index: 17">
<button class="btn ghost sm" onClick="{{toggleCity}}" aria-expanded="{{cityOpen}}" aria-haspopup="true" style="padding: 0 8px; margin-left: -8px; gap: 6px; color: #f7f8f8">
<svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="color: #e4f222"><path d="M12 21s-6-5.6-6-11a6 6 0 0 1 12 0c0 5.4-6 11-6 11z"></path><circle cx="12" cy="10" r="2.2"></circle></svg>
TP. Hồ Chí Minh
<svg class="{{cityChev}}" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="color: #8a8f98"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<sc-if value="{{cityOpen}}" hint-placeholder-val="{{false}}">
<div class="menu" role="menu" style="left: 8px; top: 50px">
<button class="mi on" role="menuitemradio" aria-checked="true" onClick="{{closeMenus}}">TP. Hồ Chí Minh<svg class="i tick" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></button>
<button class="mi" role="menuitemradio" aria-checked="false" disabled>Hà Nội<span class="aside">Sắp có</span></button>
<button class="mi" role="menuitemradio" aria-checked="false" disabled>Đà Nẵng<span class="aside">Sắp có</span></button>
</div>
</sc-if>
<button class="ib" aria-label="Tìm kiếm" style="margin-left: auto"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></button>
<button class="ib" aria-label="Thông báo, 2 mới"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg><span style="position: absolute; right: 11px; top: 11px; width: 7px; height: 7px; border-radius: 50%; background: #eb5757; box-shadow: 0 0 0 2px #08090a"></span></button>
</header>

<div style="position: relative; z-index: 16; display: flex; flex-direction: column; gap: 8px; padding: 6px 16px 0">
<span class="m num">{{meta}}</span>
<h1 class="d2" style="position: relative">
<button class="dd" onClick="{{toggleTime}}" aria-expanded="{{timeOpen}}" aria-haspopup="true">{{timeLabel}}<svg class="{{timeChev}}" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="color: #8a8f98"><path d="M6 9l6 6 6-6"></path></svg></button>
<span style="display: block">có gì chơi?</span>
<sc-if value="{{timeOpen}}" hint-placeholder-val="{{false}}">
<div class="menu" role="menu" style="left: 0; top: 42px; letter-spacing: -.01em; font-weight: 400">
<sc-for list="{{times}}" as="t" hint-placeholder-count="3">
<button class="{{t.cls}}" role="menuitemradio" aria-checked="{{t.on}}" onClick="{{t.pick}}">{{t.label}}<span class="aside num">{{t.n}}</span></button>
</sc-for>
</div>
</sc-if>
</h1>
</div>

<div class="hscroll" style="padding: 16px 16px 0">
<sc-for list="{{genres}}" as="c" hint-placeholder-count="6">
<button class="{{c.cls}}" onClick="{{c.pick}}" aria-pressed="{{c.on}}"><span class="mk"></span>{{c.label}}</button>
</sc-for>
</div>

<sc-if value="{{hasAny}}" hint-placeholder-val="{{true}}">
<article style="position: relative; height: 228px; margin: 16px 16px 0">
<div class="art g-{{f.g}}" style="position: absolute; inset: 0"></div>
<div style="position: absolute; left: 10px; right: 10px; top: 10px; display: flex; align-items: center; justify-content: space-between">
<span class="tag glass" style="color: #f7f8f8">{{f.badge}}</span>
<button class="{{f.heartCls}}" onClick="{{f.save}}" aria-label="Lưu sự kiện" aria-pressed="{{f.saved}}" style="color: #f7f8f8"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path class="fillable" d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></button>
</div>
<a class="glass g-{{f.g}}" href="App-Event.dc.html" style="position: absolute; left: 10px; right: 10px; bottom: 10px; padding: 12px 14px; border-radius: 10px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: end">
<span class="m" style="display: inline-flex; align-items: center; gap: 6px; color: #d0d6e0"><span class="mk"></span>{{f.gl}}</span>
<span></span>
<span class="h ell">{{f.title}}</span>
<span class="{{f.priceCls}}">{{f.price}}</span>
<span class="s ell" style="color: #d0d6e0">{{f.when}} · {{f.km}}</span>
<span></span>
</a>
</article>

<div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 16px 4px">
<span class="m">Gần bạn · {{restCount}}</span>
<a class="s" href="App-Map.dc.html" style="display: inline-flex; align-items: center; gap: 4px; color: #d0d6e0; min-height: 32px">Xem bản đồ<svg class="i" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</div>
<div style="padding: 0 16px; display: flex; flex-direction: column">
<sc-for list="{{rest}}" as="e" hint-placeholder-count="4">
<a class="row g-{{e.g}}" href="App-Event.dc.html">
<div class="art g-{{e.g}}"></div>
<div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
<span class="hs ell">{{e.title}}</span>
<span class="s ell" style="display: flex; align-items: center; gap: 6px"><span class="mk"></span>{{e.when}}</span>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 3px">
<span class="{{e.priceCls}}">{{e.priceShort}}</span>
<span class="s num">{{e.km}}</span>
</div>
</a>
</sc-for>
</div>
</sc-if>

<sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
<div class="card" style="margin: 16px; padding: 28px 20px; display: flex; flex-direction: column; align-items: flex-start; gap: 12px">
<span class="h">Chưa có sự kiện phù hợp</span>
<span class="s">Thử khoảng thời gian dài hơn hoặc bỏ bớt bộ lọc.</span>
<button class="btn sm" onClick="{{reset}}">Xoá bộ lọc</button>
</div>
</sc-if>

<nav class="tabbar glass" aria-label="Điều hướng chính">
<a class="tb on" href="Main.dc.html" aria-current="page"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg>Khám phá</a>
<a class="tb" href="App-Map.dc.html"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"></path><path d="M9 4v14M15 6v14"></path></svg>Bản đồ</a>
<a class="tb" href="#"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>Đã lưu</a>
<a class="tb" href="App-Ticket.dc.html"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9V6h18v3a3 3 0 0 0 0 6v3H3v-3a3 3 0 0 0 0-6z"></path><path d="M14 6v12"></path></svg>Vé</a>
<a class="tb" href="Profile-Fan-App.dc.html"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 20a8 8 0 0 1 16 0"></path></svg>Tôi</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { time: 'weekend', genre: 'all', saved: { dto: true }, menu: null };
  }
  renderVals() {
    const s = this.state;
    const PROMO = { id: 'dto', g: 'edm', gl: 'EDM · Saola khép đêm', title: 'Đêm Trắng Open Air', when: 'T7 10.10 · 17:00', km: '3.5 km', price: 'từ 450.000₫', priceShort: '450K', badge: 'Nổi bật' };
    const EV = [
      { id: 'hozo', g: 'fest', gl: 'Lễ hội', title: 'HOZO Super Fest', when: '18–20.09 · 17:00', km: '2.4 km', price: 'Miễn phí', priceShort: 'Miễn phí', free: true, badge: 'Đang hot', t: ['tonight', 'weekend', 'month'] },
      { id: 'warmup', g: 'edm', gl: 'EDM', title: 'Ravolution Warm-up · Rooftop', when: 'T6 18.09 · 19:00', km: '0.8 km', price: 'từ 350.000₫', priceShort: '350K', badge: 'Tối nay', t: ['tonight', 'weekend', 'month'] },
      { id: 'ravo', g: 'edm', gl: 'EDM', title: 'Ravolution Music Festival', when: 'T7 19.09 · 16:00', km: '6.1 km', price: 'từ 1.200.000₫', priceShort: '1,2tr', badge: 'Sắp hết vé', t: ['weekend', 'month'] },
      { id: 'outcast', g: 'cult', gl: 'Văn hoá', title: 'Saigon Outcast Night Market', when: '19–20.09 · 16:00', km: '3.0 km', price: 'Miễn phí', priceShort: 'Miễn phí', free: true, badge: 'Miễn phí', t: ['weekend', 'month'] },
      { id: 'rapviet', g: 'live', gl: 'Nhạc sống', title: 'Rap Việt Live Stage', when: 'CN 20.09 · 19:00', km: '5.2 km', price: 'Hết vé', priceShort: 'Hết vé', out: true, badge: 'Hết vé', t: ['weekend', 'month'] },
      { id: 'momang', g: 'fest', gl: 'Lễ hội', title: 'Những Thành Phố Mơ Màng', when: 'T7 26.09 · 15:00', km: '5.6 km', price: 'từ 890.000₫', priceShort: '890K', badge: 'Bán chạy', t: ['month'] },
      { id: 'dto', g: 'edm', gl: 'EDM', title: 'Đêm Trắng Open Air', when: 'T7 10.10 · 17:00', km: '3.5 km', price: 'từ 450.000₫', priceShort: '450K', badge: 'Bán chạy', t: ['month'] },
      { id: 'bsa', g: 'live', gl: 'Nhạc sống', title: 'Bờ Sông Acoustic', when: 'CN 18.10 · 18:00', km: '4.1 km', price: 'từ 200.000₫', priceShort: '200K', badge: 'Mới đăng', t: ['month'] }
    ];
    const TIMES = [['tonight', 'Tối nay', 'T6 18.09'], ['weekend', 'Cuối tuần này', '18–20.09'], ['month', '30 ngày tới', '18.09–17.10']];
    const GEN = [['all', 'Tất cả'], ['fest', 'Lễ hội'], ['live', 'Nhạc sống'], ['edm', 'EDM'], ['cult', 'Văn hoá'], ['free', 'Miễn phí']];
    const inGenre = (e) => s.genre === 'all' || (s.genre === 'free' ? e.free : e.g === s.genre);
    const tm = TIMES.find((x) => x[0] === s.time) || TIMES[1];
    const list = EV.filter((e) => e.t.indexOf(s.time) > -1 && inGenre(e));
    const promoFits = inGenre(PROMO);
    const f = promoFits ? PROMO : (list[0] || EV[0]);
    const rest = list.filter((e) => e.id !== f.id);
    const priceCls = (e) => e.free ? 'mb acc-t' : (e.out ? 'mb fog' : 'mb');
    const menu = (k) => () => this.setState({ menu: s.menu === k ? null : k });
    return {
      anyMenu: !!s.menu,
      closeMenus: () => this.setState({ menu: null }),
      cityOpen: s.menu === 'city',
      cityChev: 'i chev' + (s.menu === 'city' ? ' up' : ''),
      toggleCity: menu('city'),
      timeOpen: s.menu === 'time',
      timeChev: 'i chev' + (s.menu === 'time' ? ' up' : ''),
      toggleTime: menu('time'),
      timeLabel: tm[1],
      meta: 'TP.HCM · ' + tm[2] + ' · ' + list.length + ' sự kiện',
      times: TIMES.map(([k, label]) => ({
        label, on: s.time === k, cls: 'mi' + (s.time === k ? ' on' : ''),
        n: EV.filter((e) => e.t.indexOf(k) > -1).length,
        pick: () => this.setState({ time: k, menu: null })
      })),
      genres: GEN.map(([k, label]) => ({ label, on: s.genre === k, cls: 'chip' + (k === 'all' ? '' : ' g-' + k) + (s.genre === k ? ' on' : ''), pick: () => this.setState({ genre: k }) })),
      hasAny: list.length > 0 || promoFits,
      empty: list.length === 0 && !promoFits,
      reset: () => this.setState({ time: 'month', genre: 'all' }),
      f: Object.assign({}, f, {
        priceCls: priceCls(f),
        saved: !!s.saved[f.id],
        heartCls: 'ib glass sm' + (s.saved[f.id] ? ' on' : ''),
        save: () => this.setState({ saved: Object.assign({}, s.saved, { [f.id]: !s.saved[f.id] }) })
      }),
      restCount: rest.length,
      rest: rest.map((e) => Object.assign({}, e, { priceCls: priceCls(e) }))
    };
  }
}
</script>
</body>
</html>
