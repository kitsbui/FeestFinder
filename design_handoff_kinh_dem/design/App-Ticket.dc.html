<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { idx: 1 };
  }
  renderVals() {
    const i = this.state.idx;
    const T = {
      1: { who: 'Nguyễn Minh', code: 'RVL-26-4F8K-2Q', tier: 'Phổ thông', gate: 'B' },
      2: { who: 'Linh Phạm', code: 'RVL-26-9A2C-7M', tier: 'Phổ thông', gate: 'B' }
    };
    return {
      idx: i,
      t: T[i],
      dots: [1, 2].map((k) => ({
        on: k === i,
        label: 'Vé ' + k,
        style: k === i ? 'width: 20px; height: 8px; border-radius: 9999px; background: #101010' : 'width: 8px; height: 8px; border-radius: 50%; background: #b5b5b5',
        pick: () => this.setState({ idx: k })
      }))
    };
  }
}
