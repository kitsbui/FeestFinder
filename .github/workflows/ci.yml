name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the code; the token they get can do nothing else.
permissions:
  contents: read

jobs:
  api:
    name: API (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The suite runs on PGlite the way developers do, and on a real Postgres
        # server the way production does.
        database: [pglite, postgres]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: festfinder-backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: festfinder-backend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://postgres:postgres@localhost:5432/postgres' || '' }}

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: festfinder-web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: festfinder-web/package-lock.json

      - run: npm ci

      # Generates the route types, then checks everything with them. The build copies public/ui.
      - name: Typecheck
        run: npm run typecheck

      # Type-aware ESLint: bugs are errors; warnings (any, …) may only go down (--max-warnings in package.json).
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  screens:
    name: Screens (${{ matrix.front }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The Next.js site and its back offices, with a fresh API behind it.
        front: [next]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            festfinder-backend/package-lock.json
            festfinder-web/package-lock.json

      - run: npm ci
        working-directory: festfinder-backend

      - run: npm ci
        working-directory: festfinder-web

      # The Chromium build that matches the Playwright version in the lockfile.
      - name: Install browsers
        run: npx playwright install --with-deps chromium
        working-directory: festfinder-backend

      - name: Smoke-test every route
        run: npm run test:screens
        working-directory: festfinder-backend
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.front }}
          path: festfinder-backend/test-results/
          retention-days: 7
